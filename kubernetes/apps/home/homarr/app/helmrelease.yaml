---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      homarr:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate # sqlite on a RWO volume
        containers:
          app:
            image:
              repository: ghcr.io/homarr-labs/homarr
              tag: v2.14.0@sha256:742940b00ed13e8649ddfd81532ad8f4140ad413ed0591f464ff6e4f7ff3c276
            env:
              TZ: America/New_York
            envFrom:
              # Required: the container exits without SECRET_ENCRYPTION_KEY.
              # Create the SOPS secret `homarr-secret` (key SECRET_ENCRYPTION_KEY,
              # value from `openssl rand -hex 32`) in this namespace.
              - secretRef:
                  name: homarr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 7575
                  initialDelaySeconds: 15
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests: { cpu: 50m, memory: 256Mi }
              limits: { memory: 1Gi }
    service:
      app:
        controller: homarr
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.woo-ops.dev"
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      appdata:
        type: persistentVolumeClaim
        storageClass: longhorn-retain
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /appdata
