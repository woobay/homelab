---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-prometheus-stack
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 82.16.0
  url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  timeout: 15m
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: prometheus
    grafana:
      enabled: false
      forceDeployDatasource: false
    defaultRules:
      create: true
    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: 45GB
        enableRemoteWriteReceiver: true
        enableFeatures:
          - exemplar-storage
        # pick up ServiceMonitors/PodMonitors/rules from every chart
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeInterval: 30s
        resources:
          requests: { cpu: 200m, memory: 1Gi }
          limits: { memory: 3Gi }
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-retain
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-retain
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
      # no notification receiver configured on purpose (alerts visible in UI only)
    # Talos: control plane components are bound to 0.0.0.0 (see talos/talconfig.yaml)
    kubeEtcd:
      enabled: true
      service:
        enabled: true
        port: 2381
        targetPort: 2381
      serviceMonitor:
        scheme: http
    kubeControllerManager:
      enabled: true
      service:
        enabled: true
        port: 10257
        targetPort: 10257
      serviceMonitor:
        https: true
        insecureSkipVerify: true
    kubeScheduler:
      enabled: true
      service:
        enabled: true
        port: 10259
        targetPort: 10259
      serviceMonitor:
        https: true
        insecureSkipVerify: true
    # cilium replaces kube-proxy on this cluster
    kubeProxy:
      enabled: false
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      prometheus:
        monitor:
          enabled: true
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              sourceLabels: [__meta_kubernetes_pod_node_name]
              targetLabel: nodename
    prometheusOperator:
      resources:
        requests: { cpu: 50m, memory: 128Mi }
