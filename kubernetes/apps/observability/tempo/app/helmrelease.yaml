---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: tempo
      version: 3.2.1
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: observability
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  values:
    tempo:
      retention: 72h # 3d
      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/traces
          wal:
            path: /var/tempo/wal
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      overrides:
        defaults:
          metrics_generator:
            processors: [service-graphs, span-metrics]
      metricsGenerator:
        enabled: true
        remoteWriteUrl: http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/write
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 1Gi }
    persistence:
      enabled: true
      storageClassName: longhorn-retain
      size: 15Gi
    serviceMonitor:
      enabled: true
