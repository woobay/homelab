---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-community
spec:
  interval: 2h
  url: https://grafana-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: loki
      version: 21.6.4
      sourceRef:
        kind: HelmRepository
        name: grafana-community
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  values:
    deploymentMode: Monolithic
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: 168h # 7d
        allow_structured_metadata: true
        volume_enabled: true
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      pattern_ingester:
        enabled: true
    singleBinary:
      replicas: 1
      resources:
        requests: { cpu: 100m, memory: 512Mi }
        limits: { memory: 2Gi }
      persistence:
        enabled: true
        storageClass: longhorn-retain
        size: 30Gi
    backend: { replicas: 0 }
    read: { replicas: 0 }
    write: { replicas: 0 }
    chunksCache: { enabled: false }
    resultsCache: { enabled: false }
    gateway: { enabled: false }
    lokiCanary: { enabled: false }
    test: { enabled: false }
    monitoring:
      serviceMonitor:
        enabled: true
