apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ac-authserver
spec:
  interval: 30m
  dependsOn:
    - name: ac-database
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        enabled: true
        type: deployment
        replicas: 1
        containers:
          main:
            image:
              repository: acore/ac-wotlk-authserver
              tag: "16.0.0-dev"
              pullPolicy: IfNotPresent
            env:
              AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;changeme-strong-password;acore_auth"
              AC_UPDATES_ENABLE_DATABASES: "7"
            probes:
              liveness:
                enabled: true
                type: TCP
                spec:
                  initialDelaySeconds: 15
                  periodSeconds: 10
              readiness:
                enabled: true
                type: TCP
                spec:
                  initialDelaySeconds: 10
                  periodSeconds: 5
    service:
      main:
        enabled: true
        primary: true
        controller: main
        ports:
          auth:
            enabled: true
            primary: true
            port: 3724
    route:
      main:
        enabled: true
        kind: TCPRoute
        parentRefs:
          - name: envoy-external
            namespace: networking
            sectionName: wow-auth
        rules:
          - backendRefs:
              - identifier: main
                port: 3724
