# ac-database.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ac-database
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        enabled: true
        type: statefulset
        replicas: 1
        containers:
          main:
            image:
              repository: mariadb
              tag: "10.11"
              pullPolicy: IfNotPresent
            env:
              MYSQL_ROOT_PASSWORD: "changeme-strong-password"
            resources:
              requests: {cpu: 250m, memory: 512Mi}
              limits: {cpu: 2000m, memory: 2Gi}
            probes:
              liveness:
                enabled: true
                type: TCP
                spec:
                  initialDelaySeconds: 20
                  periodSeconds: 10
              readiness:
                enabled: true
                type: TCP
                spec:
                  initialDelaySeconds: 10
                  periodSeconds: 5
    service:
      main:
        enabled: true
        primary: true
        controller: main
        ports:
          mysql:
            enabled: true
            primary: true
            port: 3306
    persistence:
      data:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /var/lib/mysql
