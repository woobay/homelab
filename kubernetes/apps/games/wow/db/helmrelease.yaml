apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ac-database
  namespace: games
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        enabled: true
        type: statefulset
        replicas: 1
        containers:
          main:
            image:
              repository: mysql
              tag: "8.4"
              pullPolicy: IfNotPresent
            env:
              MYSQL_ROOT_PASSWORD: "changeme-strong-password"
            resources:
              requests: {cpu: 250m, memory: 1Gi}
              limits: {cpu: 2000m, memory: 3Gi}
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - mysqladmin
                      - ping
                      - -h
                      - localhost
                      - -uroot
                      - -p$(MYSQL_ROOT_PASSWORD)
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 60
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 6
                  exec:
                    command:
                      - mysqladmin
                      - ping
                      - -h
                      - localhost
                      - -uroot
                      - -p$(MYSQL_ROOT_PASSWORD)
              readiness:
                enabled: true
                custom: true
                spec:
                  initialDelaySeconds: 15
                  periodSeconds: 5
                  failureThreshold: 6
                  exec:
                    command:
                      - mysqladmin
                      - ping
                      - -h
                      - localhost
                      - -uroot
                      - -p$(MYSQL_ROOT_PASSWORD)
    service:
      main:
        enabled: true
        primary: true
        controller: main
        ports:
          mysql:
            enabled: true
            primary: true
            port: 3306
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: /var/lib/mysql
