apiVersion: batch/v1
kind: Job
metadata:
  name: ac-db-import
  namespace: games
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: main
          # Built from mod-playerbots/azerothcore-wotlk (Playerbot branch)
          # with the mod-playerbots module, so it includes the playerbots
          # SQL migrations for acore_playerbots.
          # See: https://github.com/woobay/azerothcore-playerbots-docker
          image: ghcr.io/woobay/ac-wotlk-playerbots-dbimport:latest
          env:
            - name: AC_LOGIN_DATABASE_INFO
              valueFrom:
                secretKeyRef:
                  name: ac-database-secret
                  key: AC_LOGIN_DATABASE_INFO
            - name: AC_WORLD_DATABASE_INFO
              valueFrom:
                secretKeyRef:
                  name: ac-database-secret
                  key: AC_WORLD_DATABASE_INFO
            - name: AC_CHARACTER_DATABASE_INFO
              valueFrom:
                secretKeyRef:
                  name: ac-database-secret
                  key: AC_CHARACTER_DATABASE_INFO
            - name: AC_PLAYERBOTS_DATABASE_INFO
              valueFrom:
                secretKeyRef:
                  name: ac-database-secret
                  key: AC_PLAYERBOTS_DATABASE_INFO
            # Core database updates. Bitmask: LOGIN(1) + CHARACTER(2) +
            # WORLD(4) = 7. There is no "playerbots" bit here - HOTFIX(8)
            # is unrelated to playerbots. Playerbots has its own separate
            # toggle below.
            - name: AC_UPDATES_ENABLE_DATABASES
              value: "7"
            # Playerbots database updates are controlled by their own
            # independent boolean flag (Playerbots.Updates.EnableDatabases),
            # not part of the core bitmask above. Only db-import has the
            # module's data/sql/playerbots/* files copied in, so this must
            # stay enabled here (and disabled on worldserver/authserver,
            # which don't have those files and will crash trying to read
            # them if this is left on there).
            - name: AC_PLAYERBOTS_UPDATES_ENABLE_DATABASES
              value: "1"
            - name: AC_PLAYERBOTS_DATABASE_WORKER_THREADS
              value: "1"
            - name: AC_PLAYERBOTS_DATABASE_SYNCH_THREADS
              value: "1"
