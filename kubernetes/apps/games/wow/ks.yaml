---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ac-database
spec:
  interval: 1h
  path: ./kubernetes/apps/games/wow/db
  postBuild:
    substitute:
      APP: ac-database
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: games
  decryption:
    provider: sops
    secretRef:
      name: sops-age
