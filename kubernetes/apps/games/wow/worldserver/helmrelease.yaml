apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ac-worldserver
spec:
  interval: 30m
  dependsOn:
    - name: ac-database
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        enabled: true
        type: statefulset
        replicas: 1
        initContainers:
          init-playerbots-modules:
            # The worldserver image ships with an empty /azerothcore/modules
            # directory (only ac-db-import gets modules/data copied in per
            # upstream's Dockerfile). worldserver needs
            # modules/mod-playerbots/data/sql/playerbots/* on disk to
            # populate the acore_playerbots database at startup, so reuse
            # the db-import image (which has these files) purely to seed a
            # shared emptyDir before the main container starts.
            image:
              repository: ghcr.io/woobay/ac-wotlk-playerbots-dbimport
              tag: "latest"
            command: ["sh", "-c"]
            args:
              # cp -r (not -a): -a tries to preserve the mount-root's own
              # timestamp/attributes, which fails with "Operation not
              # permitted" on the emptyDir mountpoint boundary and makes
              # cp exit non-zero, failing this initContainer even though
              # every file actually copied fine. Verified locally with
              # docker before pushing.
              - "cp -r /azerothcore/modules/. /playerbots-modules-seed/"
        containers:
          main:
            # Matches upstream docker-compose's stdin_open/tty settings.
            # Without these, `kubectl attach` connects and shows output but
            # has no interactive stdin channel - keystrokes never reach the
            # process, which looks like the console is "stuck" repeating
            # itself with no way to type.
            stdin: true
            tty: true
            image:
              # Built from mod-playerbots/azerothcore-wotlk (Playerbot branch)
              # with the mod-playerbots module compiled in.
              # See: https://github.com/woobay/azerothcore-playerbots-docker
              repository: ghcr.io/woobay/ac-wotlk-playerbots-worldserver
              tag: "latest"
              # Always (not IfNotPresent): the tag is a floating "latest",
              # not a pinned digest, and there's no Flux image-automation
              # wired up to detect new pushes. IfNotPresent would silently
              # keep running whatever was cached on the node even after a
              # new image lands in GHCR - Always makes every pod
              # (re)start actually check for a newer digest.
              pullPolicy: Always
            env:
              AC_LOGIN_DATABASE_INFO:
                valueFrom:
                  secretKeyRef:
                    name: ac-database-secret
                    key: AC_LOGIN_DATABASE_INFO
              AC_WORLD_DATABASE_INFO:
                valueFrom:
                  secretKeyRef:
                    name: ac-database-secret
                    key: AC_WORLD_DATABASE_INFO
              AC_CHARACTER_DATABASE_INFO:
                valueFrom:
                  secretKeyRef:
                    name: ac-database-secret
                    key: AC_CHARACTER_DATABASE_INFO
              AC_PLAYERBOTS_DATABASE_INFO:
                valueFrom:
                  secretKeyRef:
                    name: ac-database-secret
                    key: AC_PLAYERBOTS_DATABASE_INFO
              AC_UPDATES_ENABLE_DATABASES: "7"
              # IMPORTANT: unlike login/world/character, the playerbots
              # database is populated by worldserver itself at startup
              # (compiled into the module), NOT by ac-db-import - db-import's
              # binary doesn't know about the playerbots database at all
              # (confirmed: its logs never touch acore_playerbots). This
              # must stay enabled here. It needs
              # modules/mod-playerbots/data/sql/playerbots/* on disk, which
              # the init-playerbots-modules initContainer below provides,
              # since the upstream worldserver image ships with an empty
              # /azerothcore/modules directory.
              AC_PLAYERBOTS_UPDATES_ENABLE_DATABASES: "1"
              AC_DATA_DIR: "/azerothcore/env/dist/data"
              # Homelab nodes are 4c/4t (no hyperthreading) - the core
              # simulation loop defaults to a single thread
              # (MapUpdate.Threads=1), which caps worldserver at one
              # physical core no matter how high the CPU limit is set.
              # Splitting to 2 threads (upstream guidance: cores - 2)
              # leaves the other 2 cores free for the OS/kubelet/other
              # pods sharing that node.
              AC_MAP_UPDATE_THREADS: "2"
              # Small 2-player server - bump rates so less time is spent
              # solo-grinding trash levels/gold and more time is spent
              # actually playing together. 3x is a moderate bump; easy to
              # tune up/down later.
              AC_RATE_XP_KILL: "3"
              AC_RATE_XP_QUEST: "3"
              AC_RATE_XP_EXPLORE: "3"
              AC_RATE_DROP_MONEY: "3"
              AC_RATE_DROP_ITEM_NORMAL: "2"
              AC_RATE_DROP_ITEM_RARE: "2"
              AC_RATE_DROP_ITEM_EPIC: "1.5"
              AC_RATE_REPUTATION_GAIN: "2"
              # Profession skill-up chance: mod-playerbots' own bot AI has
              # no reliable gathering/crafting behavior (open upstream
              # issues, no fix available), so this mainly benefits the real
              # player - doubles the chance to gain a skill point per
              # successful gather/craft action. Combine with mod-ah-bot-plus
              # (buy mats/finished goods from the bot-populated AH) rather
              # than relying on bots to gather for you.
              AC_SKILL_GAIN_CRAFTING: "2"
              AC_SKILL_GAIN_GATHERING: "2"
              # mod-individual-xp: per-character XP multiplier on top of the
              # AC_RATE_XP_* rates above, self-service via .xp set <rate> in
              # game (capped at MaxXPRate). DefaultXPRate=1 means nobody's
              # rate changes until they opt in - preserves current 3x
              # behavior by default.
              AC_INDIVIDUAL_XP_ENABLED: "1"
              AC_INDIVIDUAL_XP_ANNOUNCE: "1"
              AC_INDIVIDUAL_XP_ANNOUNCE_RATES_ON_LOGIN: "1"
              AC_INDIVIDUAL_XP_MAX_XP_RATE: "3"
              AC_INDIVIDUAL_XP_DEFAULT_XP_RATE: "1"
              # Silences "missing property" log noise; these are non-fatal
              # and default to 1 either way, but explicit is nicer to read.
              AC_PLAYERBOTS_DATABASE_WORKER_THREADS: "1"
              AC_PLAYERBOTS_DATABASE_SYNCH_THREADS: "1"
              # Playerbots config overrides via env vars instead of a
              # mounted playerbots.conf: AC's entrypoint needs write access
              # to /azerothcore/env/dist/etc (and its modules/ subdir) to
              # sync .conf.dist files from the image on every boot. A
              # ConfigMap subPath mount there makes that directory
              # effectively read-only, breaking that sync and crashing the
              # container with a permission error. Settings map from
              # AiPlayerbot.X -> AC_AI_PLAYERBOT_X (dots -> underscores,
              # uppercased, AC_ prefixed).
              AC_AI_PLAYERBOT_ENABLED: "1"
              AC_AI_PLAYERBOT_RANDOM_BOT_AUTOLOGIN: "1"
              # Only run bots while a real player is actually online -
              # otherwise they'd grind CPU 24/7 on shared homelab hardware
              # even when nobody's playing. Bots log in ~30s after the
              # first real player logs in, and log out ~300s after the
              # last real player logs out.
              AC_AI_PLAYERBOT_DISABLED_WITHOUT_REAL_PLAYER: "1"
              AC_AI_PLAYERBOT_DISABLED_WITHOUT_REAL_PLAYER_LOGIN_DELAY: "30"
              AC_AI_PLAYERBOT_DISABLED_WITHOUT_REAL_PLAYER_LOGOUT_DELAY: "300"
              # Bumped from 5/20 to 20/100. NOTE: RandomBotConcentrateInPlayerZone
              # + SyncLevelWithPlayers below mean a meaningful chunk of these
              # 100 bots get actively pulled near the real player rather than
              # spread across the world - this is heavier on CPU than the raw
              # count suggests. Resource limits intentionally left untouched
              # for now; watch `kubectl top pod` and in-game `.server info`
              # latency after rollout and dial MaxRandomBots back down (or
              # bump limits) if things look strained.
              AC_AI_PLAYERBOT_MIN_RANDOM_BOTS: "20"
              AC_AI_PLAYERBOT_MAX_RANDOM_BOTS: "100"
              AC_AI_PLAYERBOT_RANDOM_BOT_ACCOUNT_PREFIX: "rndbot"
              # Throttles how many idle/non-concentrated bots run full AI
              # simultaneously - required once bot count is above ~20-30 per
              # upstream guidance, otherwise un-tuned activity can cause
              # runaway memory/CPU growth. Smart-scale weights activity by
              # level proximity instead of a flat percentage.
              AC_AI_PLAYERBOT_BOT_ACTIVE_ALONE: "10"
              AC_AI_PLAYERBOT_BOT_ACTIVE_ALONE_SMART_SCALE: "1"
              AC_AI_PLAYERBOT_BOT_ACTIVE_ALONE_SMART_SCALE_WHEN_MIN_LEVEL: "1"
              AC_AI_PLAYERBOT_BOT_ACTIVE_ALONE_SMART_SCALE_WHEN_MAX_LEVEL: "80"
              # Automatically concentrate bots near real players' level and
              # location, instead of relying on GM commands (.character
              # level, .levelup) to manually fix up bot levels - keeps
              # things feeling like a real RPG rather than admin-cheated.
              # Caps the random bot population's level ceiling to track
              # online players, so the pool doesn't drift toward max level
              # over time.
              AC_AI_PLAYERBOT_SYNC_LEVEL_WITH_PLAYERS: "1"
              # Bots teleport into zones containing real players, so
              # level-appropriate bots are also physically nearby/findable.
              AC_AI_PLAYERBOT_RANDOM_BOT_CONCENTRATE_IN_PLAYER_ZONE: "1"
              # Periodically rebalances the random bot population across
              # level brackets, weighted toward brackets containing real
              # players - actively pulls existing bots toward your level
              # over time, not just newly (re)randomized ones.
              AC_AI_PLAYERBOT_LEVEL_BRACKETS_ENABLED: "1"
              AC_AI_PLAYERBOT_LEVEL_BRACKETS_DYNAMIC_USE_DYNAMIC_DISTRIBUTION: "1"
              # 3.0 = noticeably stronger concentration than default (1.0)
              # without being extreme. See upstream docs for the exact
              # weighting formula/examples.
              AC_AI_PLAYERBOT_LEVEL_BRACKETS_DYNAMIC_REAL_PLAYER_WEIGHT: "3.0"
            resources:
              # Homelab nodes are 4 CPU / 16Gi each, shared with everything
              # else in the cluster - a limit anywhere near a full node's
              # capacity risks starving the OS/kubelet and every other pod
              # co-scheduled on that node. Keep well under one node's worth.
              requests: {cpu: 250m, memory: 1Gi}
              limits: {cpu: 3000m, memory: 8Gi}
            probes:
              liveness:
                enabled: true
                type: TCP
                spec:
                  initialDelaySeconds: 60
                  periodSeconds: 15
              readiness:
                enabled: true
                type: TCP
                spec:
                  initialDelaySeconds: 45
                  periodSeconds: 10
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 3001
            fsGroup: 3001
    service:
      main:
        enabled: true
        primary: true
        controller: main
        ports:
          world:
            enabled: true
            primary: true
            port: 8085
          soap:
            enabled: true
            port: 7878
    persistence:
      client-data:
        enabled: true
        type: nfs
        server: "192.168.20.5"
        path: "/mnt/storage/config/wow-client-data"
        globalMounts:
          - path: /azerothcore/env/dist/data
            readOnly: true
      playerbots-modules:
        type: emptyDir
        advancedMounts:
          main:
            init-playerbots-modules:
              - path: /playerbots-modules-seed
            main:
              - path: /azerothcore/modules
