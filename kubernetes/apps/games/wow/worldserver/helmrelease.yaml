apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ac-worldserver
spec:
  interval: 30m
  dependsOn:
    - name: ac-database
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      main:
        enabled: true
        type: statefulset
        replicas: 1
        containers:
          main:
            image:
              # Built from mod-playerbots/azerothcore-wotlk (Playerbot branch)
              # with the mod-playerbots module compiled in.
              # See: https://github.com/woobay/azerothcore-playerbots-docker
              repository: ghcr.io/woobay/ac-wotlk-playerbots-worldserver
              tag: "latest"
              pullPolicy: IfNotPresent
            env:
              AC_LOGIN_DATABASE_INFO:
                valueFrom:
                  secretKeyRef:
                    name: ac-database-secret
                    key: AC_LOGIN_DATABASE_INFO
              AC_WORLD_DATABASE_INFO:
                valueFrom:
                  secretKeyRef:
                    name: ac-database-secret
                    key: AC_WORLD_DATABASE_INFO
              AC_CHARACTER_DATABASE_INFO:
                valueFrom:
                  secretKeyRef:
                    name: ac-database-secret
                    key: AC_CHARACTER_DATABASE_INFO
              AC_PLAYERBOTS_DATABASE_INFO:
                valueFrom:
                  secretKeyRef:
                    name: ac-database-secret
                    key: AC_PLAYERBOTS_DATABASE_INFO
              AC_UPDATES_ENABLE_DATABASES: "7"
              AC_DATA_DIR: "/azerothcore/env/dist/data"
            resources:
              # Playerbots simulates many bot players in addition to
              # normal worldserver load, so this needs significantly more
              # headroom than a vanilla worldserver. Tune MinRandomBots /
              # MaxRandomBots in playerbots.conf together with these limits.
              requests: {cpu: 2000m, memory: 6Gi}
              limits: {cpu: 8000m, memory: 16Gi}
            probes:
              liveness:
                enabled: true
                type: TCP
                spec:
                  initialDelaySeconds: 60
                  periodSeconds: 15
              readiness:
                enabled: true
                type: TCP
                spec:
                  initialDelaySeconds: 45
                  periodSeconds: 10
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 3001
            fsGroup: 3001
    service:
      main:
        enabled: true
        primary: true
        controller: main
        ports:
          world:
            enabled: true
            primary: true
            port: 8085
          soap:
            enabled: true
            port: 7878
    persistence:
      client-data:
        enabled: true
        type: nfs
        server: "192.168.20.5"
        path: "/mnt/storage/config/wow-client-data"
        globalMounts:
          - path: /azerothcore/env/dist/data
            readOnly: true
      playerbots-config:
        type: configMap
        name: ac-worldserver-playerbots-conf
        globalMounts:
          - path: /azerothcore/env/dist/etc/modules/playerbots.conf
            subPath: playerbots.conf
            readOnly: true
