# Overrides for AzerothCore's playerbots.conf.dist.
# Only settings that differ from the module's shipped defaults need to be
# listed here; anything omitted falls back to playerbots.conf.dist.
# Full reference: https://github.com/mod-playerbots/mod-playerbots/wiki/Playerbot-Configuration

# Enable the playerbots module
AiPlayerbot.Enabled = 1

# Enable randombots so the world feels populated without manual setup
AiPlayerbot.RandomBotAutologin = 1

# Start very conservative for a 3-node homelab cluster (4 CPU / 16Gi per
# node, shared with everything else). Each bot adds meaningful CPU/DB
# load; raise gradually once resource usage at this count is confirmed
# stable, watching worldserver CPU and MySQL load closely as you scale up.
AiPlayerbot.MinRandomBots = 5
AiPlayerbot.MaxRandomBots = 20

# Keep bot accounts easily identifiable/manageable
AiPlayerbot.RandomBotAccountPrefix = "rndbot"

# Recommended by upstream docs: roughly (CPU cores - 2). On these 4-core
# nodes that's ~2. This belongs in worldserver.conf, not playerbots.conf,
# but is noted here as a reminder since it's the single most impactful
# setting for playerbot performance. Set MapUpdate.Threads = 2 (or similar)
# if a custom worldserver.conf is added later.
